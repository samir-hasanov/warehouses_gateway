server:
  port: 8085

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true

app:
  warehouses-management:
    client:
      base-url: http://localhost:8087
    api:
      # Brand endpoints
      BrandController_getAllActiveBrands: /api/1.1/brands
      BrandController_getBrandById: /api/1.1/brands/{id}
      BrandController_getBrandByCode: /api/1.1/brands/code/{code}
      BrandController_searchBrands: /api/1.1/brands/search
      BrandController_createBrand: /api/1.1/brands
      BrandController_updateBrand: /api/1.1/brands/{id}
      BrandController_deleteBrand: /api/1.1/brands/{id}
      # Category endpoints
      CategoryController_getAllActiveCategories: /api/1.1/categories
      CategoryController_getCategoryById: /api/1.1/categories/{id}
      CategoryController_getCategoryByCode: /api/1.1/categories/code/{code}
      CategoryController_searchCategories: /api/1.1/categories/search
      CategoryController_createCategory: /api/1.1/categories
      CategoryController_updateCategory: /api/1.1/categories/{id}
      CategoryController_deleteCategory: /api/1.1/categories/{id}
      # Warehouse endpoints
      WarehouseController_getAllActiveWarehouses: /api/1.1/warehouses
      WarehouseController_getWarehouseById: /api/1.1/warehouses/{id}
      WarehouseController_getWarehouseByCode: /api/1.1/warehouses/code/{code}
      WarehouseController_createWarehouse: /api/1.1/warehouses
      WarehouseController_updateWarehouse: /api/1.1/warehouses/{id}
      WarehouseController_deleteWarehouse: /api/1.1/warehouses/{id}
      # Product endpoints
      ProductController_getAllActiveProducts: /api/1.1/products
      ProductController_getProductById: /api/1.1/products/{id}
      ProductController_getProductByCode: /api/1.1/products/code/{code}
      ProductController_getProductByBarcode: /api/1.1/products/barcode/{barcode}
      ProductController_searchProducts: /api/1.1/products/search
      ProductController_createProduct: /api/1.1/products
      ProductController_updateProduct: /api/1.1/products/{id}
      ProductController_deleteProduct: /api/1.1/products/{id}
      # Stock Movement endpoints
      StockMovementController_addStockByBarcode: /api/1.1/stock-movements/stock-in-by-barcode
      # Stock endpoints
      StockController_getAllStocks: /api/1.1/stocks
      StockController_getStockById: /api/1.1/stocks/{id}
      StockController_getStocksByWarehouse: /api/1.1/stocks/warehouse/{warehouseId}
      StockController_getStocksByProduct: /api/1.1/stocks/product/{productId}
      StockController_getLowStockItems: /api/1.1/stocks/low-stock

  warehouses-order-service:
    client:
      base-url: http://localhost:8086
    api:
      # Order endpoints
      OrderController_getAllOrders: /api/1.1/orders
      OrderController_getOrderById: /api/1.1/orders/{id}
      OrderController_getOrderByNumber: /api/1.1/orders/number/{orderNumber}
      OrderController_getOrdersByStatus: /api/1.1/orders/status/{status}
      OrderController_getOrdersByPaymentStatus: /api/1.1/orders/payment-status/{paymentStatus}
      OrderController_getOrdersByCustomer: /api/1.1/orders/customer/{email}
      OrderController_searchOrders: /api/1.1/orders/search
      OrderController_createOrder: /api/1.1/orders
      OrderController_updateOrder: /api/1.1/orders/{id}
      OrderController_updateOrderStatus: /api/1.1/orders/{id}/status
      OrderController_updatePaymentStatus: /api/1.1/orders/{id}/payment-status
      OrderController_cancelOrder: /api/1.1/orders/{id}/cancel
      OrderController_completeOrder: /api/1.1/orders/{id}/complete
      # Discount endpoints
      DiscountController_getAllDiscounts: /api/1.1/discounts
      DiscountController_getDiscountById: /api/1.1/discounts/{id}
      DiscountController_getDiscountByCode: /api/1.1/discounts/code/{code}
      DiscountController_getActiveDiscounts: /api/1.1/discounts/active
      DiscountController_searchDiscounts: /api/1.1/discounts/search
      DiscountController_createDiscount: /api/1.1/discounts
      DiscountController_updateDiscount: /api/1.1/discounts/{id}
      DiscountController_deleteDiscount: /api/1.1/discounts/{id}
      DiscountController_validateDiscount: /api/1.1/discounts/validate
      # Price endpoints
      PriceController_getAllPrices: /api/1.1/prices
      PriceController_getPriceById: /api/1.1/prices/{id}
      PriceController_getPricesByProduct: /api/1.1/prices/product/{productId}
      PriceController_getPricesByWarehouse: /api/1.1/prices/warehouse/{warehouseId}
      PriceController_getCurrentPrice: /api/1.1/prices/product/{productId}/current
      PriceController_getPriceHistory: /api/1.1/prices/product/{productId}/history
      PriceController_createPrice: /api/1.1/prices
      PriceController_updatePrice: /api/1.1/prices/{id}
      PriceController_deletePrice: /api/1.1/prices/{id}



